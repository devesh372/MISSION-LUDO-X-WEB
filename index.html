
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10182b">
    <title>MISSION LUDO X</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game">

    <header class="game-header">
        <h1>MISSION LUDO X</h1>
        <p>THE ULTIMATE LUDO EXPERIENCE</p>
    </header>

    <main id="game-screen">

        <section class="player-row">
            <div class="player-panel red-panel">
                <h2>BOT 1</h2>
                <div class="player-info">
                    <div class="pawn-set red-pawns">
                        <span>●</span><span>●</span>
                        <span>●</span><span>●</span>
                    </div>
                    <button class="player-dice" data-player="red">🎲</button>
                </div>
            </div>

            <div class="player-panel green-panel">
                <h2>BOT 2</h2>
                <div class="player-info">
                    <div class="pawn-set green-pawns">
                        <span>●</span><span>●</span>
                        <span>●</span><span>●</span>
                    </div>
                    <button class="player-dice" data-player="green">🎲</button>
                </div>
            </div>
        </section>

        <div id="ludo-board"></div>

        <section class="player-row">
            <div class="player-panel blue-panel">
                <h2>YOU</h2>
                <div class="player-info">
                    <div class="pawn-set blue-pawns">
                        <span>●</span><span>●</span>
                        <span>●</span><span>●</span>
                    </div>
                    <button class="player-dice" data-player="blue">🎲</button>
                </div>
            </div>

            <div class="player-panel yellow-panel">
                <h2>BOT 3</h2>
                <div class="player-info">
                    <div class="pawn-set yellow-pawns">
                        <span>●</span><span>●</span>
                        <span>●</span><span>●</span>
                    </div>
                    <button class="player-dice" data-player="yellow">🎲</button>
                </div>
            </div>
        </section>

        <div id="game-message">MISSION LUDO X READY</div>

    </main>
</div>

<script src="script.js"></script>
</body>
</html>
